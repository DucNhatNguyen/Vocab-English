<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Từ Ngày</title>
    <meta name="description" content="Từ Ngày - học từ vựng tiếng Anh mỗi ngày" />
    <meta name="theme-color" content="#FBF7EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Từ Ngày" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <script>
      // Apply a forced light/dark theme before first paint (cached by src/lib/theme.ts).
      try {
        var t = localStorage.getItem('tu-ngay-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#16202b' : '#fbf7ee')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
