<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Liquid glass" app icon: soft lavender-to-sky gradient, "Từ" drawn as blue-violet strokes (no fonts,
       so rasterization is reliable) and a red-pen check. All artwork sits inside the central 80% circle
       so the same file works as a maskable icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d8ff"/>
      <stop offset="0.55" stop-color="#e4eeff"/>
      <stop offset="1" stop-color="#cdeaff"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="100" y1="180" x2="390" y2="390">
      <stop offset="0" stop-color="#2558e6"/>
      <stop offset="1" stop-color="#6a4cf0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0 22)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- "Từ" in blue-violet ink -->
    <g stroke="url(#ink)" stroke-width="34">
      <path d="M100 180H236M168 180V362"/>
      <path d="M264 254V320C264 350 282 366 308 366C334 366 350 352 350 330M350 254V366"/>
      <path d="M350 268Q374 268 384 246"/>
      <path d="M292 196L324 224"/>
    </g>
    <!-- red-pen check mark -->
    <path d="M338 128L362 152L408 100" stroke="#D7263D" stroke-width="22"/>
  </g>
</svg>
